name: Build iOS App

on: [push]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies & Briefcase
      run: |
        brew install create-dmg
        pip install --upgrade pip
        pip install briefcase

    - name: Create iOS App Package
      run: briefcase create iOS --no-input

    - name: Build iOS App
      run: briefcase build iOS --no-input

    - name: Package as .ipa
      run: |
        # Crée un dossier Payload requis pour les .ipa
        mkdir -p Payload
        # Déplace l'application compilée par Xcode dans Payload
        cp -R randomizer/ios/xcode/build/Release-iphoneos/*.app Payload/
        # Compresse le tout en un fichier .ipa nommé Randomizer.ipa
        zip -r Randomizer.ipa Payload
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Randomizer-IPA
        path: Randomizer.ipa
        if-no-files-found: ignore
