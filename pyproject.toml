[tool.briefcase]
project_name = "iPhone Processor"
bundle = "org.example"
version = "0.1.0"
license = "MIT"
author = "Marc Eddy Camara"

[tool.briefcase.app.randomizer]
formal_name = "iPhone Processor"
description = "Traitement EXIF et bruit iPhone"
icon = "src/randomizer/resources/randomizer"
sources = [
    "src/randomizer"
]
requires = [
    "toga>=0.3.0",
    "numpy>=1.20.0",
    "pillow>=9.0.0",
    "piexif>=1.1.3"
]
test_requires = [
    "pytest",
]

[tool.briefcase.app.randomizer.iOS]
supported_platforms = [
    "iphoneos"
]
